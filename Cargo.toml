[workspace]
members = [
    "crates/selu-core",
    "crates/selu-orchestrator",
    "crates/selu-updater",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Jan Thewes"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }

# gRPC
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"

# Docker API
bollard = "0.21"

# Crypto / security
ring = "0.17"
base64 = "0.23"

# HTTP (low-level server, used by egress proxy)
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# HTTP client (for outbound webhook calls + LLM APIs)
reqwest = { version = "0.13", features = ["json", "query", "stream", "multipart"] }
eventsource-stream = "0.2"

# Templating

# Config
config = "0.15"
dotenvy = "0.15"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
serde_yaml = "0.9"
urlencoding = "2"

# Password hashing
argon2 = "0.6"

# CEL filter evaluation
cel-interpreter = "0.10"

# Time (for cookie max_age)
time = "0.3"

# Archive handling (agent marketplace)
flate2 = "1"
tar = "0.4"

# Lock-free atomic pointer swap (agent snapshot reads)
arc-swap = "1"

# AWS Event Stream parsing (for Bedrock converse-stream)
aws-smithy-eventstream = "0.61"
aws-smithy-types = "1.4"
bytes = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Cron expression parsing and scheduling
cron = "0.17"
chrono-tz = "0.10"
